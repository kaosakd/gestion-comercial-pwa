<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173b31">
  <meta name="description" content="Sistema móvil de gestión comercial: productos, inventario, ventas, compras y reportes.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Comercio">
  <title>Gestión Comercial</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#dashboard" aria-label="Ir al inicio" data-nav="dashboard">
        <span class="brand-mark"><i class="bi bi-shop-window"></i></span>
        <span><strong>Gestión</strong><small>COMERCIAL</small></span>
      </a>
      <div class="topbar-actions">
        <span id="connection-indicator" class="connection-pill" title="Estado del almacenamiento"><span class="status-dot"></span><span id="connection-label">Local</span></span>
        <button id="install-button" class="btn btn-install d-none" type="button"><i class="bi bi-download"></i><span>Instalar</span></button>
        <button class="icon-button" id="settings-button" aria-label="Configuración" type="button"><i class="bi bi-gear"></i></button>
      </div>
    </header>

    <div class="subbar">
      <div>
        <div class="eyebrow" id="today-label">PANEL DE CONTROL</div>
        <h1 id="page-title">Resumen</h1>
      </div>
      <label class="role-picker"><span>Vista</span>
        <select id="role-switch" aria-label="Cambiar rol de demostración">
          <option value="cliente">Cliente</option>
          <option value="empleado">Empleado</option>
          <option value="gerente" selected>Gerente</option>
        </select>
      </label>
    </div>

    <main id="app-main" class="main-content" tabindex="-1" aria-live="polite">
      <div class="loading-card"><span class="spinner-border spinner-border-sm" aria-hidden="true"></span> Cargando sistema…</div>
    </main>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Navegación principal"></nav>
    <footer class="app-footer"><span>Gestión Comercial</span><span>Hecho para negocios que crecen</span></footer>
  </div>

  <div id="modal-backdrop" class="modal-backdrop-custom d-none" aria-hidden="true"></div>
  <section id="app-modal" class="app-modal d-none" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <div><div class="eyebrow" id="modal-kicker">FORMULARIO</div><h2 id="modal-title">Nuevo registro</h2></div>
      <button class="icon-button" type="button" data-action="close-modal" aria-label="Cerrar"><i class="bi bi-x-lg"></i></button>
    </div>
    <div id="modal-body" class="modal-body-custom"></div>
  </section>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="js/sheets-api.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/pwa.js" defer></script>
</body>
</html>
